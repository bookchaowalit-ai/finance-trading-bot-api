# Shared CI + security baseline. Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trading-bots:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: trading-bots
      python-version: "3.11"
      # Offline test deps only (no ta-lib/broker SDKs; see requirements-test.txt).
      install-command: uv pip install -r requirements-test.txt
      # Kept from the previous workflow: syntax errors and undefined names only.
      lint-command: python -m ruff check . --select E9,F63,F7,F82
      # Tests never touch a database or exchange; paper mode is forced. A non-UTC TZ catches
      # code (or tests) that mixes host-local time with exchange UTC timestamps.
      test-command: TRADING_MODE=paper TZ=Asia/Bangkok python -m pytest -q

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
